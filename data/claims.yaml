metadata:
  title: "XPU-Atlas Claim Ledger"
  version: "0.1.0"
  compiled: "2026-11-04"
  scope: >-
    Twenty processing-unit paradigms discussed in a 2026 popular technology
    transcript, audited against public sources available on 2026-11-04.
  grading:
    E1: "Primary source: official press release, regulatory filing, peer-reviewed paper, standard, or API dataset."
    E2: "Reputable secondary source: major news wire, trade press, or expert analysis."
    E3: "Tertiary source: encyclopedia or general reference."
    E0: "Unverified, conflicting, or refuted; retained for transparency."
  status_definitions:
    supported: "At least one cited source directly supports the statement."
    conflicting: "Credible sources disagree on a material detail."
    unverified: "Plausible or widely repeated, but not confirmed by a captured source."
    refuted: "A captured source contradicts the statement."

