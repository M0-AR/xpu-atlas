paradigms:
  - id: cpu
    name: "Central Processing Unit"
    abbreviation: "CPU"
    year: 1971
    year_confidence: "high"
    lifecycle: general-purpose
    claims:
      - id: cpu-001
        statement: "The CPU executes the instructions of a computer program, including arithmetic, logic, control and input/output operations."
        status: supported
        grade: E3
        sources: [S001]
        note: "Definition-level claim; encyclopedic source."
      - id: cpu-002
        statement: "The CPU is the primary, general-purpose processor and is contrasted with specialized coprocessors such as GPUs."
        status: supported
        grade: E3
        sources: [S001]
      - id: cpu-003
        statement: "Consumer desktop CPUs in 2026 span roughly 4 to 24 cores."
        status: unverified
        grade: E0
        sources: [S001]
        note: "Product-stack generalization; not sampled from vendor SKUs in this audit."

  - id: gpu
    name: "Graphics Processing Unit"
    abbreviation: "GPU"
    year: 1999
    year_confidence: "high"
    lifecycle: general-purpose
    claims:
      - id: gpu-001
        statement: "Nvidia announced the GeForce 256 on 31 August 1999 and marketed it as the world's first GPU."
        status: supported
        grade: E3
        sources: [S003]
        note: "'World's first GPU' is a marketing claim, not a neutral architectural priority claim."
      - id: gpu-002
        statement: "A GPU is a specialized circuit for digital image processing and graphics acceleration, present on discrete cards and integrated into systems-on-chip."
        status: supported
        grade: E3
        sources: [S002]
      - id: gpu-003
        statement: "GPUs are increasingly used for AI processing and model training because of linear-algebra acceleration."
        status: supported
        grade: E3
        sources: [S002]

  - id: ppu
    name: "Physics Processing Unit"
    abbreviation: "PPU"
    year: 2006
    year_confidence: "medium"
    lifecycle: absorbed
    claims:
      - id: ppu-001
        statement: "A PPU is a dedicated microprocessor for physics calculations, especially game physics engines."
        status: supported
        grade: E3
        sources: [S004]
      - id: ppu-002
        statement: "Ageia acquired NovodeX/PhysX in 2004 and produced a PhysX physics-processing chip."
        status: supported
        grade: E3
        sources: [S005]
      - id: ppu-003
        statement: "The PhysX card launched at roughly $250-300 in 2006 and Nvidia acquired Ageia in 2008, moving PhysX onto GPUs."
        status: unverified
        grade: E0
        sources: [S005]
        note: "The absorption narrative is consistent across secondary reports, but price and dates were not captured from a primary source in this snapshot."

  - id: apu
    name: "Accelerated Processing Unit"
    abbreviation: "APU"
    year: 2011
    year_confidence: "medium"
    lifecycle: integrated
    claims:
      - id: apu-001
        statement: "AMD's APU combines a general-purpose AMD64 CPU and a 3D integrated GPU on a single die."
        status: supported
        grade: E3
        sources: [S006]
      - id: apu-002
        statement: "AMD launched its first APUs in 2011."
        status: unverified
        grade: E0
        sources: [S006]
        note: "Launch year is widely reported but not present in the fetched extract."
      - id: apu-003
        statement: "The Steam Deck integrates a custom AMD APU."
        status: supported
        grade: E3
        sources: [S007]

  - id: spu
    name: "Synergistic Processing Unit"
    abbreviation: "SPU"
    year: 2006
    year_confidence: "high"
    lifecycle: absorbed
    claims:
      - id: spu-001
        statement: "The Cell Broadband Engine combines a general-purpose PowerPC PPE with multiple Synergistic Processing Elements."
        status: supported
        grade: E3
        sources: [S008]
      - id: spu-002
        statement: "Cell contains eight SPEs; one was disabled for yields and one reserved for the system, leaving six usable by games."
        status: unverified
        grade: E0
        sources: [S008]
        note: "Widely reported; the fetched extract does not contain the yield and reservation details."
      - id: spu-003
        statement: "The US Air Force built a supercomputer from 1,760 PlayStation 3 consoles."
        status: conflicting
        grade: E0
        sources: [S008]
        note: "Secondary reports differ between 1,760 and 1,716 nodes; the fetched Cell extract does not resolve the count."

  - id: npu
    name: "Neural Processing Unit"
    abbreviation: "NPU"
    year: 2017
    year_confidence: "medium"
    lifecycle: integrated
    claims:
      - id: npu-001
        statement: "An NPU is a specialized accelerator for AI and machine learning, and may be standalone or integrated into a CPU or GPU."
        status: supported
        grade: E3
        sources: [S009]
      - id: npu-002
        statement: "Apple introduced the A11 Bionic in the iPhone 8/8 Plus and iPhone X on 12 September 2017."
        status: supported
        grade: E3
        sources: [S010]
      - id: npu-003
        statement: "Apple branded the A11's AI accelerator as the Neural Engine."
        status: unverified
        grade: E0
        sources: [S010]
        note: "Device and date are verified; the Neural Engine branding is not in the fetched extract."
      - id: npu-004
        statement: "Microsoft requires an NPU capable of 40+ TOPS for Copilot+ PC certification."
        status: supported
        grade: E1
        sources: [S011, S012]

  - id: tpu
    name: "Tensor Processing Unit"
    abbreviation: "TPU"
    year: 2015
    year_confidence: "high"
    lifecycle: commercial
    claims:
      - id: tpu-001
        statement: "Google's TPU is an NPU/ASIC designed for neural-network machine learning; internal use began in 2015."
        status: supported
        grade: E3
        sources: [S013]
      - id: tpu-002
        statement: "Google announced its eighth-generation TPUs, TPU 8t for training and TPU 8i for inference, on 22 April 2026."
        status: supported
        grade: E1
        sources: [S014, S015]
      - id: tpu-003
        statement: "TPUs are offered to Google Cloud customers rather than sold as standalone PC components."
        status: supported
        grade: E1
        sources: [S014]
        note: "Cloud availability; no retail component channel was announced."

  - id: lpu
    name: "Language Processing Unit"
    abbreviation: "LPU"
    year: 2016
    year_confidence: "medium"
    lifecycle: absorbed
    claims:
      - id: lpu-001
        statement: "Groq's LPU is an inference accelerator that emphasizes deterministic execution and on-chip SRAM."
        status: supported
        grade: E2
        sources: [S019]
        note: "Architecture details are vendor claims reported by trade press."
      - id: lpu-002
        statement: "Nvidia licensed Groq's inference technology non-exclusively on 24 December 2025, hired Jonathan Ross and Sunny Madra, and reportedly paid about $20 billion."
        status: supported
        grade: E2
        sources: [S016, S017, S018]
        note: "The parties disclosed the license and hiring; the price is press-reported, not disclosed."
      - id: lpu-003
        statement: "The transcript's statement that Nvidia paid 'about $20' for Groq's technology is off by roughly three orders of magnitude; the reported figure is about $20 billion."
        status: refuted
        grade: E2
        sources: [S018]
        note: "Unit/scale error in popular narration; retained as a conflict-register entry."

  - id: mcu
    name: "Microcontroller Unit"
    abbreviation: "MCU"
    year: 1971
    year_confidence: "medium"
    lifecycle: embedded
    claims:
      - id: mcu-001
        statement: "An MCU integrates one or more processor cores, memory, and programmable I/O peripherals on a single integrated circuit."
        status: supported
        grade: E3
        sources: [S020]
      - id: mcu-002
        statement: "MCUs target embedded applications, in contrast to general-purpose microprocessors."
        status: supported
        grade: E3
        sources: [S020]
      - id: mcu-003
        statement: "A modern car can contain dozens of MCUs."
        status: unverified
        grade: E0
        sources: [S020]
        note: "Industry estimate; not sampled from teardown data."

  - id: isp
    name: "Image Signal Processor"
    abbreviation: "ISP"
    year: 1990
    year_confidence: "low"
    lifecycle: integrated
    claims:
      - id: isp-001
        statement: "An ISP/image processor is a specialized DSP or media processor for image processing in cameras and other devices."
        status: supported
        grade: E3
        sources: [S021]
      - id: isp-002
        statement: "Image processors often use SIMD or MIMD parallelism."
        status: supported
        grade: E3
        sources: [S021]
      - id: isp-003
        statement: "Two phones with the same camera sensor can produce different photos because of ISP and software differences."
        status: unverified
