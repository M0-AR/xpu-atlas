name: Bug report
description: Report a broken pipeline, figure, preview, or deployment step.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. Do not include secrets or private data."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the failure.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python, NumPy, browser"
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the smallest useful log or screenshot.
