name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Rebuild offline analysis
        run: |
          make claims
          make analyze
          make figures
          make report
      - name: Run design-space screen
        run: |
          make sim
          test -s results/simulation.json
          test -s docs/SIMULATION.md
          test -s figures/fig7_design_space.png
      - name: Build interactive preview
        run: |
          make preview
          test -s index.html
          test -f .nojekyll
      - name: Test
        run: make test
      - name: Paper check
        run: make paper-check
